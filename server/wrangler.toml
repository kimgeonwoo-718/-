name = "spell-keyboard"
main = "src/index.js"
compatibility_date = "2024-09-01"

# 사용량과 캐시. 무료 등급 D1 은 하루 쓰기 10 만 건이라 KV(1 천 건)보다 한참 여유 있다.
# database_id 는 CI 가 만들거나 찾아서 채워 넣는다 (deploy-worker.yml).
[[d1_databases]]
binding = "DB"
database_name = "spell-keyboard"
database_id = "DATABASE_ID_PLACEHOLDER"

# 구글 호출은 미국에 붙박이인 Durable Object 에서 한다 (src/index.js 의 GoogleRelay 참고).
# 무료 등급은 SQLite 저장소 클래스만 허용한다 — 저장은 안 쓰지만 선언은 그렇게 해야 한다.
[[durable_objects.bindings]]
name = "RELAY"
class_name = "GoogleRelay"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["GoogleRelay"]

[vars]
PLAY_PACKAGE = "com.spellkeyboard.ko"
# 구글 로그인에서 받아 줄 OAuth 클라이언트 ID(쉼표로 여럿). ID 토큰의 `aud` 가 여기 있어야
# 통과한다 — 이 검사가 없으면 **남의 앱에 발급된 멀쩡한 구글 토큰으로도** 우리 계정에
# 들어온다. 비어 있으면 로그인을 아예 안 받는다(503).
#
# 비밀값이 아니다. 앱 안에 그대로 들어가는 공개 식별자라 저장소에 적는다(서버 주소와 같다).
# 지금은 웹 클라이언트 하나다 — 안드로이드 Credential Manager 가 `aud` 에 넣는 것이 이것이다.
# 윈도우·아이폰이 자기 클라이언트를 따로 만들면 여기에 쉼표로 덧붙인다.
GOOGLE_CLIENT_IDS = "485298906669-s984h7he84fbs1ll21gboa17hojjur3n.apps.googleusercontent.com"
# AI 는 구독자 전용이다. 무료 한도와 IP 한도는 없앴다 — 무료에게 열어 두면 쓰는 사람이
# 늘수록 손해가 늘고(한 명이 한도를 꽉 채우면 월 468원, 받는 돈은 0원), 서버 주소는 APK
# 안에 있어 누구나 두드릴 수 있다. 돈 낸 사람만 들이는 것이 유일하게 확실한 천장이다.
#
# 구독자 하루 한도(글자).
#
# 10 만 → 2 만 → 1 만. 기준은 하나다: **어떻게 쓰든 구독 하나가 적자를 못 내야 한다.**
# 2 만이면 매일 꽉 채우는 사람은 덩어리 크기와 상관없이 원가가 구독료를 넘었다. 1 만이면
# 가장 나쁘게 써도(50자씩 200번) 월 2,100원이라 실수령 2,691원 안에 든다. 셈은
# src/quota.js 머리말에 있다. 보통 사용자(하루 5천 자)는 이 한도를 못 느낀다.
#
# 앱은 이 숫자를 사용자에게 보여 주지 않는다(결제 화면에도, 한도 초과 문구에도). 파는 건
# "AI 를 쓸 수 있다" 지 글자 수가 아니라서다. 그러니 여기만 바꾸면 된다.
SUB_DAILY_CHARS = "10000"
# 어느 쪽 모델로 갈 것인가: "gemini" 또는 "openai".
#
# OpenAI 로 갔다가 실기기 평가가 "제미나이 때보다 정확도도 속도도 못하다" 여서
# 되돌린다. 이유 셋이 전부 모델을 바꾸면 사라진다:
#   1. gpt-5 계열은 temperature 를 받으면 400 이라 못 줬다. 같은 글을 두 번 고치면
#      답이 달랐다. 구글은 받는다 — 앱이 원래 temperature 0 을 보낸다.
#   2. 숙고 토큰이 답보다 **먼저** 나온다. 그 시간이 고스란히 대기 시간이었다.
#   3. 사용자가 100% 라고 평가한 모델이 이쪽이다.
#
# 비밀값을 지우는 대신 이 한 줄로 갈리게 해 뒀다.
#
# 제미나이가 맞다. 재 봤다(2026-09-15, `server/bench/`) — 1.1초, 되살림 92~95%,
# 멀쩡한 글 건드림 2~4%. OpenAI 쪽은 숙고를 끄면 건드림이 20~33% 로 무너지고,
# 켜면 느리면서 값 이득도 없다. 자세한 것은 아래 OPENAI_MODEL 주석에 적어 뒀다.
AI_PROVIDER = "gemini"
# 구글 모델.
#
# **gemini-3.5-flash-lite 에 묶어 둔다.** 이 모델로 "교정 완벽하다" 는 평가를 받았다.
# 맞춤법·띄어쓰기는 패턴이지 판단이 아니라서 큰 모델을 당길 이유가 없다 — 값만 몇 배
# 뛴다. 한 번 제일 새 flash 를 고르게 해 봤다가 바로 되돌렸다.
#
# 비우면 서버가 하루 한 번 구글에 목록을 물어 **제일 좋은 lite** 를 고른다(등급이 세대를
# 이긴다). 구글이 이 모델을 접을 때 거기 기대면 되지만, 그때까지는 바뀌지 않는 편이 낫다 —
# 값이 조용히 바뀌는 것이 제일 나쁘다.
GEMINI_MODEL = "gemini-3.5-flash-lite"

# 아래 둘은 AI_PROVIDER = "openai" 일 때만 쓴다.
#
# 교정에 쓰는 모델.
#
# **여기로 돌아오지 마라.** 구글 크레딧이 바닥났을 때 임시로 옮겨 봤고, 재 봤더니
# 이쪽이 나은 구석이 없다(2026-09-15, `server/bench/`).
#
#   숙고를 끄면   싸고 빠른데 멀쩡한 글을 20~33% 건드린다. 제미나이는 2~4% 다.
#                 nano 뿐 아니라 mini 도 그렇다 — 크기 문제가 아니라 숙고가 하던
#                 일이 있었다는 뜻이다.
#   숙고를 켜면   한 번에 숙고 토큰이 496개, 교정문(74개)의 6.7배다. 그 시간이 그대로
#                 대기 시간이고, 숙고는 출력 요금으로 청구돼 값 이득도 사라진다.
#                 2,000원어치가 제미나이 34.5만 자, nano+숙고 34만 자로 똑같았다.
OPENAI_MODEL = "gpt-5-nano"
# 숙고 세기.
#
# low 였다가 속도 때문에 minimal 로 내렸었다. 그때 "품질이 떨어지면 low 로 되돌린다"
# 고 적어 뒀는데, 실기기에서 "기본적인 맞춤법도 자꾸 틀린다" 가 나왔다. 되돌린다.
#
# 애초에 minimal 은 품질 보정 1차에서 **Gemini 와 벌어진 원인 셋 중 하나**로 지목해
# low 로 올렸던 값이다. 속도를 위해 그걸 도로 깎았으니 같은 구멍이 다시 난 것이다.
# 느린 것은 숙고가 아니라 한국-미국 왕복 쪽이 크다(아래 RELAY_LOCATION 참고).
OPENAI_REASONING = "low"

# 지난 사용량과 만료된 캐시를 매일 새벽에 치운다.
[triggers]
crons = ["0 18 * * *"]

# 비밀값은 여기 두지 않는다. CI 가 wrangler secret put 으로 넣는다:
#   OPENAI_API_KEY         OpenAI 키 (있으면 이쪽으로 간다)
#   GEMINI_API_KEY         구글 Gemini 키 (OpenAI 키가 없을 때)
#   PLAY_SERVICE_ACCOUNT   Play Developer API 서비스 계정 JSON (없으면 전부 무료로 본다)
#   TEST_INSTALL_IDS       결제 없이 구독자로 칠 설치 ID들 (쉼표로 구분, 출시 전 삭제)
