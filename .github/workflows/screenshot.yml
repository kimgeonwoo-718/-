name: 화면 캡처

# **값이 들지 않는다**(공개 저장소의 Actions 는 공짜, AI 를 부르지 않는다).
#
# 컨테이너에는 안드로이드 SDK 가 없어(dl.google.com 이 막힘) 화면을 띄워 볼 수 없다. 그래서 레이아웃을
# "계산으로만" 맞췄다가 실기기에서 두 번 연달아 깨졌다(2026-10-02 — 아래가 비고, 다음엔 프리미엄 칸이
# 찌그러져 글이 잘림). 사용자에게 APK 를 주기 전에 **여기서 에뮬레이터로 띄워 캡처해 보고** 준다.
#
# 방아쇠: `tools/screenshot/RUN` 을 바꿔 올리면 돈다(내용은 메모일 뿐). 캡처는 `screenshots` 릴리스에
# 덮어써서 붙인다 — 컨테이너에서 curl 로 받아 볼 수 있다:
#   https://github.com/kimgeonwoo-718/-/releases/download/screenshots/home-user.png
on:
  push:
    paths:
      - "tools/screenshot/RUN"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  shoot:
    name: 에뮬레이터로 첫 화면 캡처
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: 디버그 APK 빌드
        env:
          AI_SERVER_URL: ${{ vars.AI_SERVER_URL || 'https://spell-keyboard.spell-keyboard-d5bc70.workers.dev' }}
          GOOGLE_CLIENT_ID: ${{ vars.GOOGLE_CLIENT_ID || '964399781242-do4svjcjisviqqsi9q47d51rm3fa93rf.apps.googleusercontent.com' }}
        run: ./gradlew :keyboard:assembleDebug --no-daemon

      - name: KVM 켜기
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: 에뮬레이터에서 캡처
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash tools/screenshot/shoot.sh

      - name: 캡처 올리기
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ls -l shots/ || exit 0
          if ! gh release view screenshots >/dev/null 2>&1; then
            gh release create screenshots --prerelease --title "화면 캡처 (개발용)" --notes "에뮬레이터 캡처. 커밋: $GITHUB_SHA" --target "$GITHUB_SHA"
          fi
          gh release edit screenshots --notes "에뮬레이터 캡처. 커밋: $GITHUB_SHA"
          gh release upload screenshots shots/*.png --clobber

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: shots/
