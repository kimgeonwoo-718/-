name: 모델 겨루기

# 값이 드는 일이라 아무 때나 돌지 않는다.
#
# **bench/ 를 건드리면 돈다.** 이 저장소는 기본 가지가 다른 프로젝트 가지로 돼 있어서,
# 깃허브가 이 워크플로를 "손으로 돌릴 수 있는 것" 목록에 안 올린다(기본 가지에 있는
# 것만 올린다). 그래서 시험지나 채점을 고칠 때 같이 돌게 해 뒀다 — 바꿨으면 재 보는
# 것이 맞기도 하다. 기본 가지가 이 가지로 바뀌면 아래 workflow_dispatch 가 살아난다.
on:
  push:
    paths:
      - "server/bench/**"
      - ".github/workflows/bench-models.yml"
  workflow_dispatch:
    inputs:
      models:
        description: "잴 모델들 (띄어쓰기로 구분). 예: gemini-3.5-flash-lite gemini-3.5-flash gpt-5-nano"
        required: true
        default: "gemini-3.5-flash-lite gemini-3.5-flash gemini-3.8-flash"
      limit:
        description: "쓸 문장 수 (비우면 50개 전부). 빨리 보고 싶으면 10 쯤."
        required: false
        default: ""

jobs:
  bench:
    name: 같은 시험지로 모델을 잰다
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: 잰다
        working-directory: server
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          set -euo pipefail
          # 손으로 돌리면 적어 준 대로, bench/ 를 고쳐서 돌면 기본값으로 잰다.
          models="${{ inputs.models }}"
          # 지금 쓰는 것 + 더 싼 후보 둘. 값은 수첩의 2026-09 조사 기준이다.
          #   gemini-3.5-flash-lite  $0.30/$2.50   ← 지금 쓰는 것
          #   gemini-3.1-flash-lite  $0.25/$1.50
          #   gpt-5-nano             $0.05/$0.40   ← 6배 싸다
          [ -n "$models" ] || models="gemini-3.5-flash-lite gemini-3.1-flash-lite gpt-5-nano"
          limit=""
          if [ -n "${{ inputs.limit }}" ]; then limit="--limit=${{ inputs.limit }}"; fi
          # 결과를 실행 요약에 그대로 남긴다. 로그를 뒤지지 않고 바로 보려고.
          node bench/models.mjs $models $limit | tee bench.txt
          {
            echo '## 모델 겨루기'
            echo
            echo '```'
            cat bench.txt
            echo '```'
            echo
            echo '되살림만 보고 고르지 마라. **멀쩡한 글 건드림**이 낮아야 쓸 수 있는 모델이다.'
          } >> "$GITHUB_STEP_SUMMARY"
