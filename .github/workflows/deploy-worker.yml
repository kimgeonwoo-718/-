name: Deploy AI server

on:
  push:
    branches:
      - main
      - "claude/**"
    paths:
      - "server/**"
      - ".github/workflows/deploy-worker.yml"
  workflow_dispatch:

jobs:
  test:
    name: 서버 로직 테스트
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: node --test
        working-directory: server
        run: npm test

  deploy:
    name: Cloudflare 에 배포
    needs: test
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: 비밀값 확인
        id: creds
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ] || [ -z "${CLOUDFLARE_ACCOUNT_ID:-}" ]; then
            echo "Cloudflare 비밀값이 없어 배포를 건너뛴다 (CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID)"
            echo "ready=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # **쓰기로 한 쪽의 키가 있어야 한다.** 없이 배포하면 서버가 503 을 내고 AI 가
          # 통째로 죽는데, 그때는 "왜 안 되지" 를 실기기에서 알게 된다. 여기서 막는다.
          want=$(grep -o 'AI_PROVIDER = "[^"]*"' wrangler.toml | cut -d'"' -f2)
          echo "wrangler.toml 이 쓰기로 한 쪽: ${want:-(안 적힘)}"
          if [ "$want" = "openai" ] && [ -z "${OPENAI_API_KEY:-}" ]; then
            echo "::error title=OPENAI_API_KEY 가 없다::AI_PROVIDER 가 openai 인데 키가 없다. 배포하면 서버가 503 을 낸다. 비밀값을 넣거나 AI_PROVIDER 를 gemini 로 되돌려라."
            exit 1
          fi
          if [ "$want" != "openai" ] && [ -z "${GEMINI_API_KEY:-}" ]; then
            echo "::error title=GEMINI_API_KEY 가 없다::AI_PROVIDER 가 gemini 인데 키가 없다. 배포하면 서버가 503 을 낸다."
            exit 1
          fi
          echo "ready=true" >> "$GITHUB_OUTPUT"

      # D1 은 한 번 만들면 ID 가 고정인데, 그 ID 를 wrangler.toml 에 적어야 배포된다.
      # 저장소에 실제 ID 를 박아 두는 대신 자리표시자를 두고 여기서 찾아 채운다.
      - name: D1 데이터베이스 준비
        if: steps.creds.outputs.ready == 'true'
        working-directory: server
        run: |
          set -euo pipefail
          id=$(npx --yes wrangler@3 d1 list --json | jq -r '.[] | select(.name=="spell-keyboard") | (.uuid // .id)' | head -n 1)
          if [ -z "$id" ]; then
            echo "D1 이 없어 새로 만든다"
            id=$(npx --yes wrangler@3 d1 create spell-keyboard 2>&1 | grep -oE '[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}' | head -n 1)
          fi
          [ -n "$id" ] || { echo "D1 ID 를 얻지 못했다" >&2; exit 1; }
          sed -i "s/DATABASE_ID_PLACEHOLDER/$id/" wrangler.toml
          echo "D1: $id"
          npx --yes wrangler@3 d1 migrations apply spell-keyboard --remote

      # workers.dev 주소는 계정마다 한 번 정해야 하는데, 그게 없으면 wrangler deploy 가
      # "subdomain 을 등록하라" 며 죽는다. 대시보드를 뒤지게 하는 대신 여기서 API 로 정한다.
      # 이름은 전 세계에서 유일해야 하므로 후보를 몇 개 차례로 시도한다.
      - name: workers.dev 주소 준비
        if: steps.creds.outputs.ready == 'true'
        id: subdomain
        run: |
          set -euo pipefail
          api="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/subdomain"
          auth="Authorization: Bearer ${CLOUDFLARE_API_TOKEN}"
          current=$(curl -fsS -H "$auth" "$api" | jq -r '.result.subdomain // empty' || true)
          if [ -z "$current" ]; then
            suffix=$(printf '%s' "$CLOUDFLARE_ACCOUNT_ID" | cut -c1-6)
            for candidate in "spell-keyboard" "spell-keyboard-${suffix}" "spellkb-${suffix}-$RANDOM"; do
              echo "workers.dev 이름 시도: $candidate"
              if curl -fsS -X PUT -H "$auth" -H 'Content-Type: application/json' \
                   --data "{\"subdomain\":\"$candidate\"}" "$api" >/dev/null; then
                current="$candidate"
                break
              fi
            done
          fi
          [ -n "$current" ] || { echo "workers.dev 이름을 정하지 못했다" >&2; exit 1; }
          echo "workers.dev 이름: $current"
          echo "name=$current" >> "$GITHUB_OUTPUT"

      - name: Worker 배포
        if: steps.creds.outputs.ready == 'true'
        working-directory: server
        run: npx --yes wrangler@3 deploy

      - name: 비밀값 넣기
        if: steps.creds.outputs.ready == 'true'
        working-directory: server
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          PLAY_SERVICE_ACCOUNT: ${{ secrets.PLAY_SERVICE_ACCOUNT }}
          TEST_INSTALL_IDS: ${{ secrets.TEST_INSTALL_IDS }}
        run: |
          set -euo pipefail
          # OPENAI_API_KEY 가 있으면 서버는 그쪽으로 간다. 되돌리려면 이 비밀값만 지우면
          # 되고, 그러면 다시 구글로 간다. 앱은 어느 쪽이든 같은 모양으로 주고받는다.
          if [ -n "${OPENAI_API_KEY:-}" ]; then
            printf '%s' "$OPENAI_API_KEY" | npx --yes wrangler@3 secret put OPENAI_API_KEY
            echo "OPENAI_API_KEY: 넣음 — 교정은 gpt-5-nano 로 나간다"
          else
            # 여기서 지우지는 않는다. wrangler 의 삭제는 되묻기라 CI 에서 조용히 실패할 수
            # 있고, 그러면 "지웠다" 고 찍힌 채 그대로 남는다. 되돌릴 때는 아래를 직접 친다.
            echo "OPENAI_API_KEY: 비어 있음 — 이미 넣어 둔 값이 있으면 그대로 남아 있다."
            echo "  되돌리려면: npx wrangler secret delete OPENAI_API_KEY"
          fi
          if [ -n "${GEMINI_API_KEY:-}" ]; then
            printf '%s' "$GEMINI_API_KEY" | npx --yes wrangler@3 secret put GEMINI_API_KEY
            echo "GEMINI_API_KEY: 넣음"
          else
            echo "GEMINI_API_KEY: 없음 — 서버가 503 을 돌려준다"
          fi
          if [ -n "${PLAY_SERVICE_ACCOUNT:-}" ]; then
            printf '%s' "$PLAY_SERVICE_ACCOUNT" | npx --yes wrangler@3 secret put PLAY_SERVICE_ACCOUNT
            echo "PLAY_SERVICE_ACCOUNT: 넣음"
          else
            # 거꾸로 읽기 쉬운 자리다. 이 값이 없으면 isSubscriber 가 무조건 false 라
            # **아무도 구독자가 될 수 없다** — 무료가 열리는 것이 아니라 AI 가 닫힌다.
            echo "PLAY_SERVICE_ACCOUNT: 없음 — Play 결제를 확인할 길이 없다."
            echo "  ⇒ TEST_INSTALL_IDS 에 적힌 기기 말고는 AI 가 402 로 막힌다."
          fi
          # 개발용. 여기 적힌 설치 ID 는 Play 결제 없이 구독자로 친다 — Play Console
          # 등록 전에 유료 기능(AI 번역)을 실기기에서 확인하려고 둔다.
          # 출시하면 GitHub 비밀값을 지우고 npx wrangler secret delete TEST_INSTALL_IDS 를 친다.
          if [ -n "${TEST_INSTALL_IDS:-}" ]; then
            printf '%s' "$TEST_INSTALL_IDS" | npx --yes wrangler@3 secret put TEST_INSTALL_IDS
            echo "TEST_INSTALL_IDS: 넣음 — 이 설치 ID 들은 구독자로 동작한다"
          else
            echo "TEST_INSTALL_IDS: 없음 — 결제한 사람만 구독자다 (출시 때 맞는 상태)"
            echo "  이미 넣어 둔 값을 지우려면: npx wrangler secret delete TEST_INSTALL_IDS"
          fi

      - name: 주소 확인
        if: steps.creds.outputs.ready == 'true'
        env:
          # 구독자 경로까지 확인하려고 받는다. 깃허브가 로그에서 가려 준다.
          TEST_INSTALL_IDS: ${{ secrets.TEST_INSTALL_IDS }}
          # 구글이 실제로 무슨 모델을 내주는지 눈으로 보려고 받는다.
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          set -euo pipefail
          url="https://spell-keyboard.${{ steps.subdomain.outputs.name }}.workers.dev"
          echo "::notice title=AI 서버 주소::$url"
          echo "서버 주소: $url"
          echo "이 주소를 GitHub 변수 AI_SERVER_URL 에 넣으면 다음 APK 빌드부터 앱이 서버를 쓴다."
          # 막 정한 주소는 DNS 가 퍼지는 데 잠깐 걸린다. 몇 번 두드려 보고, 안 되면 실패로 치지 않는다.
          ok=false
          for i in 1 2 3 4 5 6; do
            if curl -fsS --max-time 10 "$url/health"; then echo; echo "health: OK"; ok=true; break; fi
            sleep 10
          done
          if [ "$ok" != true ]; then
            echo "health 응답이 아직 없다 — 몇 분 뒤 브라우저에서 $url/health 를 열어 보면 된다"
            exit 0
          fi
          # 앱이 맨 처음 하는 일이 모델 목록 받기다. 이게 막히면 교정도, 모델 갈아타기도
          # 전부 막힌다. 구글이 뭐라고 하는지 원문 앞부분을 그대로 남긴다 (키는 안 찍힌다).
          # (파이프로 head 에 넘기면 curl 이 SIGPIPE 로 죽어 단계가 실패한다. 파일로 받는다.)
          # 구글이 **실제로** 무엇을 내주는지 먼저 본다. 서버가 고른 이름만 보면
          # "고른 것" 인지 "못 골라서 아는 이름으로 간 것" 인지 구분이 안 된다.
          if [ -n "${GEMINI_API_KEY:-}" ]; then
            echo "----- 구글이 지금 내주는 것 (교정에 쓸 만한 것만) -----"
            curl -sS --max-time 20 -o google.json \
              -H "x-goog-api-key: $GEMINI_API_KEY" \
              "https://generativelanguage.googleapis.com/v1beta/models?pageSize=200" || true
            jq -r '[.models[]? | select(.supportedGenerationMethods // [] | index("generateContent"))
                    | .name | sub("^models/";"")]
                   | map(select(startswith("gemini")))
                   | map(select(test("embedding|aqa|imagen|vision|tts|image|audio|video|live") | not))
                   | sort | .[]' google.json 2>/dev/null || echo "(목록을 못 읽었다)"
          fi
          # 이 이름이 곧 "지금 교정에 쓰는 모델" 이다. 서버가 위 목록에서 고른 결과라,
          # 구글이 새 모델을 내면 여기 찍히는 이름이 바뀐다.
          echo "----- 지금 쓰는 모델 (앱과 같은 요청) -----"
          curl -sS --max-time 20 -o models.json -w 'HTTP %{http_code}\n' \
            -H 'Content-Type: application/json' -H 'X-Install-Id: ci-smoke-test-0000' \
            "$url/v1beta/models?pageSize=200" || true
          jq -r '.models[]?.name' models.json 2>/dev/null | head -n 40 || true
          [ -s models.json ] && ! jq -e '.models' models.json >/dev/null 2>&1 && head -c 600 models.json && echo
          echo "----- 교정 한 번 (설치 ID 는 CI 전용 = 무료 사용자) -----"
          # AI 를 구독자 전용으로 닫은 뒤로 이 요청은 **402 subscribers_only 가 정상**이다.
          # 그래서 이 단계가 증명하는 것은 "서버가 살아 있고 무료를 제대로 막는다" 까지다.
          # LLM 까지 실제로 닿는지는 여기서 더 못 본다 — 공개 저장소에 구독자 설치 ID 를
          # 박아 두면 그걸 쓰는 사람 누구나 공짜로 AI 를 쓰게 되기 때문이다.
          # 모델이 진짜 답하는지는 구독자 기기에서 한 번 눌러 보는 것으로 확인한다.
          #
          # 200 이 찍힌다면 오히려 이상한 것이다 — 무료가 뚫렸다는 뜻이니 바로 봐야 한다.
          curl -sS --max-time 30 -o gen.json -D gen.head -w 'HTTP %{http_code} · 전체 %{time_total}초\n' -X POST \
            -H 'Content-Type: application/json' -H 'X-Install-Id: ci-smoke-test-0000' \
            --data '{"contents":[{"parts":[{"text":"안녕하새요 라고만 답해"}]}]}' \
            "$url/v1beta/models/gemini-3.5-flash-lite:generateContent" || true
          grep -i '^x-upstream-ms' gen.head || true
          head -c 1200 gen.json; echo

          # ----- 구독자 한 명으로 진짜 끝까지 -----
          # 위 402 는 "막는 것" 만 증명한다. 모델이 실제로 답하는지는 구독자여야 보인다.
          # TEST_INSTALL_IDS 가 있으면 그 첫 번째 ID 로 한 번 더 친다. 이 값은 비밀값이라
          # 깃허브가 로그에서 가려 주므로 **절대 직접 찍지 않는다** — 응답 코드와 모델이
          # 돌려준 글만 남긴다.
          if [ -n "${TEST_INSTALL_IDS:-}" ]; then
            echo "----- 교정 한 번 (구독자 = TEST_INSTALL_IDS 의 첫 번째) -----"
            first=$(printf '%s' "$TEST_INSTALL_IDS" | cut -d, -f1 | tr -d '[:space:]')
            # **앱과 같은 모양으로 보내야 한다.** 지시문 없이 "이것 좀 고쳐줘" 로 보내면
            # 모델이 채팅처럼 짧게 답하고, 그러면 서버의 길이 안전장치(tooDifferent)가
            # 정상적으로 걸러 버린다. 실제로 그렇게 짜서 502 를 받았다 — 서버가 아니라
            # 확인하는 쪽이 틀린 것이었다. 앱은 system_instruction 에 지시를 싣고
            # 사용자 글은 고칠 원문만 보낸다(GeminiCorrector.buildRequest).
            code=$(curl -sS --max-time 45 -o sub.json -w '%{http_code}' -X POST \
              -H 'Content-Type: application/json' -H "X-Install-Id: $first" \
              --data '{"system_instruction":{"parts":[{"text":"너는 한국어 맞춤법 교정기다. 입력 문장의 맞춤법과 띄어쓰기만 고쳐서 고친 문장만 출력해라. 설명하거나 덧붙이지 마라."}]},"contents":[{"role":"user","parts":[{"text":"오늘 날시가 참 조은거 같애 우리 내일 어디서 만날까 시간은 저녁 일곱시쯤이 괜찬을거 같은데"}]}],"generationConfig":{"temperature":0,"candidateCount":1}}' \
              "$url/v1beta/models/gemini-3.5-flash-lite:generateContent" || echo 000)
            echo "HTTP $code"
            jq -r '.candidates[0].content.parts[0].text // empty' sub.json 2>/dev/null || true
            if [ "$code" != "200" ]; then
              echo "::error title=구독자 교정 실패::구독자로 친 요청이 $code 다. 아래가 서버가 돌려준 원문이다."
              head -c 600 sub.json; echo
              exit 1
            fi
            echo "구독자 경로 OK — 모델까지 실제로 닿는다."
          else
            echo "TEST_INSTALL_IDS 가 없어 구독자 경로는 확인하지 못했다 (출시 때는 이게 맞다)."
          fi
