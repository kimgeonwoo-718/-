name: Deploy AI server

on:
  push:
    branches:
      - main
      - "claude/**"
    paths:
      - "server/**"
      - ".github/workflows/deploy-worker.yml"
  workflow_dispatch:

jobs:
  test:
    name: 서버 로직 테스트
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: node --test
        working-directory: server
        run: npm test

  deploy:
    name: Cloudflare 에 배포
    needs: test
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: 비밀값 확인
        id: creds
        run: |
          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ] || [ -z "${CLOUDFLARE_ACCOUNT_ID:-}" ]; then
            echo "Cloudflare 비밀값이 없어 배포를 건너뛴다 (CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID)"
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      # D1 은 한 번 만들면 ID 가 고정인데, 그 ID 를 wrangler.toml 에 적어야 배포된다.
      # 저장소에 실제 ID 를 박아 두는 대신 자리표시자를 두고 여기서 찾아 채운다.
      - name: D1 데이터베이스 준비
        if: steps.creds.outputs.ready == 'true'
        working-directory: server
        run: |
          set -euo pipefail
          id=$(npx --yes wrangler@3 d1 list --json | jq -r '.[] | select(.name=="spell-keyboard") | (.uuid // .id)' | head -n 1)
          if [ -z "$id" ]; then
            echo "D1 이 없어 새로 만든다"
            id=$(npx --yes wrangler@3 d1 create spell-keyboard 2>&1 | grep -oE '[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}' | head -n 1)
          fi
          [ -n "$id" ] || { echo "D1 ID 를 얻지 못했다" >&2; exit 1; }
          sed -i "s/DATABASE_ID_PLACEHOLDER/$id/" wrangler.toml
          echo "D1: $id"
          npx --yes wrangler@3 d1 migrations apply spell-keyboard --remote

      # workers.dev 주소는 계정마다 한 번 정해야 하는데, 그게 없으면 wrangler deploy 가
      # "subdomain 을 등록하라" 며 죽는다. 대시보드를 뒤지게 하는 대신 여기서 API 로 정한다.
      # 이름은 전 세계에서 유일해야 하므로 후보를 몇 개 차례로 시도한다.
      - name: workers.dev 주소 준비
        if: steps.creds.outputs.ready == 'true'
        id: subdomain
        run: |
          set -euo pipefail
          api="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/subdomain"
          auth="Authorization: Bearer ${CLOUDFLARE_API_TOKEN}"
          current=$(curl -fsS -H "$auth" "$api" | jq -r '.result.subdomain // empty' || true)
          if [ -z "$current" ]; then
            suffix=$(printf '%s' "$CLOUDFLARE_ACCOUNT_ID" | cut -c1-6)
            for candidate in "spell-keyboard" "spell-keyboard-${suffix}" "spellkb-${suffix}-$RANDOM"; do
              echo "workers.dev 이름 시도: $candidate"
              if curl -fsS -X PUT -H "$auth" -H 'Content-Type: application/json' \
                   --data "{\"subdomain\":\"$candidate\"}" "$api" >/dev/null; then
                current="$candidate"
                break
              fi
            done
          fi
          [ -n "$current" ] || { echo "workers.dev 이름을 정하지 못했다" >&2; exit 1; }
          echo "workers.dev 이름: $current"
          echo "name=$current" >> "$GITHUB_OUTPUT"

      - name: Worker 배포
        if: steps.creds.outputs.ready == 'true'
        working-directory: server
        run: npx --yes wrangler@3 deploy

      - name: 비밀값 넣기
        if: steps.creds.outputs.ready == 'true'
        working-directory: server
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PLAY_SERVICE_ACCOUNT: ${{ secrets.PLAY_SERVICE_ACCOUNT }}
        run: |
          set -euo pipefail
          if [ -n "${GEMINI_API_KEY:-}" ]; then
            printf '%s' "$GEMINI_API_KEY" | npx --yes wrangler@3 secret put GEMINI_API_KEY
            echo "GEMINI_API_KEY: 넣음"
          else
            echo "GEMINI_API_KEY: 없음 — 서버가 503 을 돌려준다"
          fi
          if [ -n "${PLAY_SERVICE_ACCOUNT:-}" ]; then
            printf '%s' "$PLAY_SERVICE_ACCOUNT" | npx --yes wrangler@3 secret put PLAY_SERVICE_ACCOUNT
            echo "PLAY_SERVICE_ACCOUNT: 넣음"
          else
            echo "PLAY_SERVICE_ACCOUNT: 없음 — 결제 확인 없이 전부 무료로 동작"
          fi

      - name: 주소 확인
        if: steps.creds.outputs.ready == 'true'
        run: |
          set -euo pipefail
          url="https://spell-keyboard.${{ steps.subdomain.outputs.name }}.workers.dev"
          echo "::notice title=AI 서버 주소::$url"
          echo "서버 주소: $url"
          echo "이 주소를 GitHub 변수 AI_SERVER_URL 에 넣으면 다음 APK 빌드부터 앱이 서버를 쓴다."
          # 막 정한 주소는 DNS 가 퍼지는 데 잠깐 걸린다. 몇 번 두드려 보고, 안 되면 실패로 치지 않는다.
          for i in 1 2 3 4 5 6; do
            if curl -fsS --max-time 10 "$url/health"; then echo; echo "health: OK"; exit 0; fi
            sleep 10
          done
          echo "health 응답이 아직 없다 — 몇 분 뒤 브라우저에서 $url/health 를 열어 보면 된다"
