name: Build APK

on:
  push:
    branches:
      - main
      - "claude/**"
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: 맞춤법 키보드 APK
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: JDK 17 설치
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: 교정 엔진 단위 테스트
        run: ./gradlew :core:test --no-daemon

      # 서명 키를 고정한다. 없으면 러너가 매번 새 디버그 키를 만들어 덮어쓰기 설치가
      # 안 되고, Play 에 올릴 수도 없다.
      - name: 서명 키 준비
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -n "${KEYSTORE_BASE64:-}" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/signing.jks"
            echo "서명 키: 비밀값에서 복원"
          else
            echo "서명 키: 없음 — 러너의 임시 디버그 키를 쓴다 (매번 바뀜)"
          fi

      - name: 디버그 APK 빌드
        env:
          # 앱에는 Gemini 키가 들어가지 않는다. 키는 중계 서버(server/)에만 있다.
          # 서버 주소는 비밀이 아니라 저장소에 적어 둔다. GitHub 변수(또는 실수로 비밀값에
          # 넣었어도)가 있으면 그게 우선이다 — 서버를 다른 곳으로 옮길 때 쓴다.
          AI_SERVER_URL: ${{ vars.AI_SERVER_URL || secrets.AI_SERVER_URL || 'https://spell-keyboard.spell-keyboard.workers.dev' }}
          KEYSTORE_FILE: ${{ runner.temp }}/signing.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -n "${AI_SERVER_URL:-}" ]; then echo "AI 서버: $AI_SERVER_URL"; else echo "AI 서버: 없음 — 사용자 키만 동작"; fi
          ./gradlew :keyboard:assembleDebug --no-daemon

      - name: APK 모으기
        id: collect
        run: |
          set -euo pipefail
          apk=$(find keyboard/build/outputs/apk/debug -name "*.apk" | head -n 1)
          if [ -z "$apk" ]; then
            echo "APK 를 찾지 못했다" >&2
            exit 1
          fi
          mkdir -p dist
          cp "$apk" dist/spell-keyboard-debug.apk
          ls -lh dist/

      # 사이드로드한 키보드는 Play Protect 가 경고를 띄운다. 경고를 없앨 수는 없지만,
      # 빌드된 APK 가 실제로 무슨 권한을 갖는지는 증명할 수 있다.
      - name: APK 권한 감사
        run: |
          set -euo pipefail
          aapt2=$(find "$ANDROID_HOME/build-tools" -name aapt2 -type f | sort -V | tail -n 1)

          echo "===== 패키지 정보 ====="
          "$aapt2" dump badging dist/spell-keyboard-debug.apk | grep -E "^package:|^application-label:|^sdkVersion|^targetSdkVersion"

          echo
          echo "===== 선언된 권한 ====="
          perms=$("$aapt2" dump badging dist/spell-keyboard-debug.apk | grep -E "^uses-permission" || true)
          if [ -z "$perms" ]; then
            echo "선언된 권한 없음 (인터넷 권한 없음 = 어떤 데이터도 밖으로 나갈 수 없음)"
          else
            echo "$perms"
          fi

          echo
          echo "===== SHA-256 ====="
          sha256sum dist/spell-keyboard-debug.apk

      - name: APK 업로드
        uses: actions/upload-artifact@v4
        with:
          name: spell-keyboard-debug-apk
          path: dist/spell-keyboard-debug.apk
          if-no-files-found: error
          retention-days: 30

      # Actions 아티팩트는 zip 이고 로그인해야 받을 수 있다. 휴대폰에서 바로 누를 수
      # 있는 링크가 필요해서, 최신 빌드를 apk-latest 릴리스에 덮어쓴다.
      # 태그(v*)로 빌드하면 그 태그 이름으로 정식 릴리스를 만든다.
      - name: 릴리스에 붙이기
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            tag="$GITHUB_REF_NAME"
            title="맞춤법 키보드 $tag"
            extra=""
          else
            tag="apk-latest"
            title="맞춤법 키보드 (최신 빌드)"
            extra="--prerelease"
            # 굴러가는 릴리스라 이전 것을 태그까지 지우고 다시 만든다.
            gh release delete "$tag" --yes --cleanup-tag || true
          fi

          gh release create "$tag" dist/spell-keyboard-debug.apk \
            --target "$GITHUB_SHA" \
            --title "$title" \
            $extra \
            --notes "실시간 맞춤법·띄어쓰기 교정 키보드 디버그 빌드입니다.

          설치 후 앱을 열어 (1) 시스템 설정에서 키보드를 켜고 (2) 입력기로 선택하세요.

          커밋: $GITHUB_SHA"
