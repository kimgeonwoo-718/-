name: Build APK

on:
  push:
    branches:
      - main
      - "claude/**"
    tags:
      - "v*"
    # 윈도우 데스크톱만 고친 밀기에 안드로이드 APK 를 빌드할 이유가 없다.
    # 두 얼굴이 한 저장소에 있어서 생기는 헛수고를 여기서 끊는다.
    paths-ignore:
      - "desktop/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: 맞춤법 키보드 APK
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: JDK 17 설치
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: 교정 엔진 단위 테스트
        run: ./gradlew :core:test --no-daemon

      # 서명 키를 고정한다. 없으면 러너가 매번 새 디버그 키를 만들어 덮어쓰기 설치가
      # 안 되고, Play 에 올릴 수도 없다.
      - name: 서명 키 준비
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -n "${KEYSTORE_BASE64:-}" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/signing.jks"
            echo "서명 키: 비밀값에서 복원"
          else
            echo "서명 키: 없음 — 러너의 임시 디버그 키를 쓴다 (매번 바뀜)"
          fi

      - name: 디버그 APK 빌드
        env:
          # 앱에는 Gemini 키가 들어가지 않는다. 키는 중계 서버(server/)에만 있다.
          # 서버 주소는 비밀이 아니라 저장소에 적어 둔다. GitHub 변수가 있으면 그게 우선이다
          # — 서버를 다른 곳으로 옮길 때 쓴다. 비밀값은 일부러 안 본다: 로그에 가려져서
          # 값이 잘못 들어가도 무엇이 잘못됐는지 볼 수 없다.
          AI_SERVER_URL: ${{ vars.AI_SERVER_URL || 'https://spell-keyboard.spell-keyboard.workers.dev' }}
          # 구글 로그인 클라이언트 ID(웹 종류). 서버 주소처럼 비밀이 아니라 저장소에 적는다.
          # server/wrangler.toml 의 GOOGLE_CLIENT_IDS 와 **짝이 맞아야** 한다 — 안 맞으면
          # 로그인이 401 로 막힌다. 비면 설정 화면의 로그인 행이 통째로 숨는다.
          GOOGLE_CLIENT_ID: ${{ vars.GOOGLE_CLIENT_ID || '485298906669-s984h7he84fbs1ll21gboa17hojjur3n.apps.googleusercontent.com' }}
          KEYSTORE_FILE: ${{ runner.temp }}/signing.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          # Play 는 올릴 때마다 versionCode 가 커져야 한다. 실행 번호는 늘 커진다.
          VERSION_CODE: ${{ github.run_number }}
          VERSION_NAME: 0.1.${{ github.run_number }}
        run: |
          set -euo pipefail
          if [ -n "${AI_SERVER_URL:-}" ]; then echo "AI 서버: $AI_SERVER_URL"; else echo "AI 서버: 없음 — 사용자 키만 동작"; fi
          if [ -n "${GOOGLE_CLIENT_ID:-}" ]; then echo "구글 로그인: 켜짐"; else echo "구글 로그인: 없음 — 로그인 행이 숨는다"; fi
          echo "버전: $VERSION_NAME (code $VERSION_CODE)"
          # Play 에 올릴 릴리스 번들은 서명 키가 있을 때만 만든다. 서명 없는 번들은 Play 가 받지 않는다.
          if [ -f "$KEYSTORE_FILE" ]; then
            ./gradlew :keyboard:assembleDebug :keyboard:bundleRelease --no-daemon
          else
            ./gradlew :keyboard:assembleDebug --no-daemon
          fi

      - name: APK 모으기
        id: collect
        run: |
          set -euo pipefail
          apk=$(find keyboard/build/outputs/apk/debug -name "*.apk" | head -n 1)
          if [ -z "$apk" ]; then
            echo "APK 를 찾지 못했다" >&2
            exit 1
          fi
          mkdir -p dist
          cp "$apk" dist/spell-keyboard-debug.apk
          aab=$(find keyboard/build/outputs/bundle/release -name "*.aab" 2>/dev/null | head -n 1 || true)
          if [ -n "$aab" ]; then
            cp "$aab" dist/spell-keyboard-release.aab
            echo "Play 업로드용 번들: dist/spell-keyboard-release.aab"
          else
            echo "릴리스 번들 없음 (서명 키가 없는 빌드)"
          fi
          ls -lh dist/

      # 구글 로그인은 "이 패키지 + 이 서명" 으로 등록된 안드로이드 클라이언트가 있어야
      # 계정 창을 띄워 준다. 그 서명 지문(SHA-1)을 여기서 찍는다. 공개 정보다 — 설치된
      # APK 에서 누구나 꺼낼 수 있는 값이라 로그에 남아도 된다. 비밀번호는 안 쓴다.
      - name: 서명 지문 (구글 로그인 등록용)
        run: |
          set -euo pipefail
          signer=$(ls -d "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -n 1)
          "$signer" verify --print-certs dist/spell-keyboard-debug.apk | grep -i "SHA-1" || true

      # 사이드로드한 키보드는 Play Protect 가 경고를 띄운다. 경고를 없앨 수는 없지만,
      # 빌드된 APK 가 실제로 무슨 권한을 갖는지는 증명할 수 있다.
      - name: APK 권한 감사
        run: |
          set -euo pipefail
          aapt2=$(find "$ANDROID_HOME/build-tools" -name aapt2 -type f | sort -V | tail -n 1)

          echo "===== 패키지 정보 ====="
          "$aapt2" dump badging dist/spell-keyboard-debug.apk | grep -E "^package:|^application-label:|^sdkVersion|^targetSdkVersion"

          echo
          echo "===== 선언된 권한 ====="
          perms=$("$aapt2" dump badging dist/spell-keyboard-debug.apk | grep -E "^uses-permission" || true)
          if [ -z "$perms" ]; then
            echo "선언된 권한 없음 (인터넷 권한 없음 = 어떤 데이터도 밖으로 나갈 수 없음)"
          else
            echo "$perms"
          fi

          echo
          echo "===== SHA-256 ====="
          sha256sum dist/spell-keyboard-debug.apk

      - name: APK 업로드
        uses: actions/upload-artifact@v4
        with:
          name: spell-keyboard-debug-apk
          path: dist/spell-keyboard-debug.apk
          if-no-files-found: error
          retention-days: 30

      # Actions 아티팩트는 zip 이고 로그인해야 받을 수 있다. 휴대폰에서 바로 누를 수
      # 있는 링크가 필요해서, 최신 빌드를 apk-latest 릴리스에 덮어쓴다.
      # 태그(v*)로 빌드하면 그 태그 이름으로 정식 릴리스를 만든다.
      - name: 릴리스에 붙이기
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          files=(dist/spell-keyboard-debug.apk)
          [ -f dist/spell-keyboard-release.aab ] && files+=(dist/spell-keyboard-release.aab)
          notes="실시간 맞춤법·띄어쓰기 교정 키보드 디버그 빌드입니다.

          설치 후 앱을 열어 (1) 시스템 설정에서 키보드를 켜고 (2) 입력기로 선택하세요.

          커밋: $GITHUB_SHA"

          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            tag="$GITHUB_REF_NAME"
            title="맞춤법 키보드 $tag"
            extra=""
          else
            tag="apk-latest"
            title="맞춤법 키보드 (최신 빌드)"
            extra="--prerelease"
          fi

          # **릴리스를 지우지 않는다.** 예전에는 태그까지 지우고 다시 만들었는데, 지우기는
          # 되고 만들기에서 멈추면 링크가 통째로 사라진다. 2026-09-17 에 그렇게 30분 넘게
          # 404 가 났다 — 받는 사람에게는 "APK 가 없어졌다" 로 보인다.
          #
          # 파일만 덮어쓰면 그 창이 아예 없다. 태그는 옛 커밋을 가리키게 되지만, 받는
          # 사람에게 중요한 것은 링크에 걸린 APK 가 최신인지다. 커밋 번호는 아래 notes 에
          # 적히므로 어느 빌드인지도 알 수 있다.

          # 멈추면 **실패로 만든다.** 매달려 있으면 빌드가 끝나지도 실패하지도 않아서
          # 무엇이 잘못됐는지 보이지 않는다. 빨간불은 고칠 수 있지만 매달린 것은 알아채지도
          # 못한다. 130MB 를 올리는 데 5분이면 넉넉하다(평소 40초).
          upload() {
            for attempt in 1 2 3; do
              if timeout 300 "$@"; then return 0; fi
              echo "::warning::릴리스 올리기 실패/시간초과 ($attempt/3). 20초 뒤 다시."
              sleep 20
            done
            echo "::error::릴리스에 APK 를 올리지 못했다. APK 자체는 이 실행의 Artifacts 에 있다."
            return 1
          }

          # **파일이 하나도 안 붙은 릴리스는 성한 것이 아니다.** 올리다 끊긴 자국일 수 있고,
          # 그런 릴리스에는 다시 올려도 계속 막힌다 — 2026-09-17 에 두 시간 동안 같은 자리에서
          # 시간초과만 났다. 오류 메시지 하나 없이 멈추기만 한다.
          #
          # 비어 있을 때만 지우고 새로 만든다. 잃을 파일이 없으니 안전하다. **파일이 붙어 있는
          # 릴리스는 절대 지우지 않는다** — 지웠다가 만들기가 막히면 링크가 통째로 비는 창이
          # 생기고, 그게 이 소동의 시작이었다.
          if gh release view "$tag" >/dev/null 2>&1 &&
             [ "$(gh release view "$tag" --json assets --jq '.assets | length' 2>/dev/null || echo 0)" = "0" ]; then
            echo "::warning::릴리스에 파일이 하나도 없다. 지우고 새로 만든다."
            gh release delete "$tag" --yes --cleanup-tag || true
            sleep 5
          fi

          if gh release view "$tag" >/dev/null 2>&1; then
            # **내보내기가 먼저다.** 파일 올리기가 막히더라도 링크는 살아 있어야 한다.
            #
            # --draft=false 를 반드시 준다. 파일 올리는 도중에 끊긴 릴리스는 초안으로 남는데,
            # 초안은 태그가 만들어지지 않아 밖에서 404 다. 그대로 두면 다음 빌드가 그 초안을
            # 찾아 파일만 덮어쓰고 "성공" 으로 끝나서, 빌드는 초록인데 링크는 계속 없는 상태가
            # 이어진다. 2026-09-17 에 그렇게 한참을 헤맸다 — 그날 올리기를 먼저 하고 있어서
            # 올리기가 막힌 채로 내보내기에 닿지도 못했다.
            gh release edit "$tag" --title "$title" --notes "$notes" --draft=false --prerelease
            upload gh release upload "$tag" "${files[@]}" --clobber
          else
            # **만들기와 올리기를 가른다.** `gh release create` 에 파일을 같이 주면 초안으로
            # 만든 뒤 올리고 나서야 게시하는데, 올리기가 막히면 초안인 채로 남아 밖에서
            # 404 다. 2026-09-17 에 그렇게 초안만 여러 개 쌓였다.
            #
            # 파일 없이 먼저 만들면 게시는 바로 끝난다. 링크는 그 순간부터 살아 있고,
            # 파일은 그 뒤에 붙는다. 올리기가 실패해도 링크가 사라지지는 않는다.
            gh release create "$tag" \
              --target "$GITHUB_SHA" \
              --title "$title" \
              $extra \
              --notes "$notes"
            upload gh release upload "$tag" "${files[@]}" --clobber
          fi
